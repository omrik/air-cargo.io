name: Sync OpenAPI Spec

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenAPI spec
        run: |
          curl -sf https://www.air-cargo.io/api/openapi.json -o /tmp/openapi.json
          # Only accept a real spec, never an error page.
          python3 -c "import json; d = json.load(open('/tmp/openapi.json')); assert d['openapi'].startswith('3') and d['paths']"
          python3 -c "import json; json.dump(json.load(open('/tmp/openapi.json')), open('site/api/openapi.json', 'w'), indent=1, sort_keys=True)"
      - name: Commit if changed
        run: |
          if git diff --quiet site/api/openapi.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "openapi-sync[bot]"
          git config user.email "openapi-sync@air-cargo.io"
          git add site/api/openapi.json
          git commit -m "chore: sync OpenAPI spec from production"
          git push
